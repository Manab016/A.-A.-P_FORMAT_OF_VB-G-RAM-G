<style>

*{

}

body{

 color:#17212b;

 font-size:15px;
}

header{

 padding:18px 12px;

}

header h1{

}

header p{

}

}


.container{

 padding:10px;
}

.card{

.form{

input,
select{

input:focus,
select:focus{

}

button{

 border:0;
 border-radius:9px;
 padding:12px 14px;

 min-height:46px;
}

.primary{

.success{

 color:#fff;
}

.danger{
 background:#c0392b;

}

.gray{

}

.actions,
.toolbar{

 grid-template-columns:1fr 1fr;

.toolbar .search{

}

.count{

.tablebox{

 padding:0 8px 12px;
}

table{
 border-collapse:collapse;
 width:100%;
 min-width:1150px;
 font-size:12px;
}

th,
td{
 border:1px solid #aeb8c2;
 padding:7px;
 vertical-align:top;
}

th{
 background:#e9eff4;
 text-align:center;
 white-space:nowrap;
 font-weight:800;
}

td{
 white-space:normal;
 overflow-wrap:anywhere;

}

.actionbtn{
 padding:7px 9px;
 min-height:34px;
 font-size:12px;
 margin:2px;
}

.empty{
 text-align:center;
 padding:30px;
 color:#65717d;
}

@media(max-width:600px){

 .form{
  grid-template-columns:1fr;
 }

 .actions,
 .toolbar{
  grid-template-columns:1fr 1fr;
 }

 input{
  font-size:16px;
 }

}

</style>

</head>

<script>


/* =====================================================
   PERMANENT LOCAL STORAGE
   ===================================================== */

const KEY =
 'AAP_OFFLINE_DATA_MOBILE_V2';


/*
 Old versions-এর data থাকলে
 সেটাও automatically খুঁজে current
 storage-এ নিয়ে আসবে।
*/

const OLD_KEYS = [

 'AAP_OFFLINE_DATA',

 'AAP_DATA',

 'AAP_OFFLINE_DATA_MOBILE',

 'AAP_OFFLINE_DATA_MOBILE_V1'

];


const ids = [

 'scheme',

 'nature',

 'lengthArea',

 'mouza',

 'startDag',

 'endDag',

 'jobCard',

 'lat1',

 'long1',

 'lat2',

 'long2'

];


let data = [];

let editIndex = -1;



/* =====================================================
   BASIC FUNCTIONS
   ===================================================== */

const $ = id =>
 document.getElementById(id);


const val = id =>
 $(id).value.trim();



/* =====================================================
   HTML ESCAPE
   ===================================================== */

function esc(s){

 return String(s ?? '').replace(

  /[&<>"']/g,

  c => ({

   '&':'&amp;',

   '<':'&lt;',

   '>':'&gt;',

   '"':'&quot;',

   "'":'&#39;'

  }[c])

 );

}



/* =====================================================
   LOAD DATA
   ===================================================== */

function load(){

 try{

  let raw =
   localStorage.getItem(KEY);


  if(raw){

   const x =
    JSON.parse(raw);

   data =
    Array.isArray(x)
    ? x
    : [];

  }


  else{

   data = [];


   for(
    const oldKey of OLD_KEYS
   ){

    const oldRaw =
     localStorage.getItem(oldKey);


    if(!oldRaw)
     continue;


    try{

     const oldData =
      JSON.parse(oldRaw);


     if(
      Array.isArray(oldData) &&
      oldData.length
     ){

      data = oldData;


      localStorage.setItem(

       KEY,

       JSON.stringify(data)

      );


      break;

     }

    }

    catch(e){}

   }

  }

 }

 catch(e){

  data = [];

 }


 render();

}



/* =====================================================
   SAVE DATA
   ===================================================== */

function persist(){

 try{

  /*
   localStorage-এ কোনো expiry নেই।

   Browser/site data clear না করা পর্যন্ত
   data নিজে থেকে remove হবে না।
  */

  localStorage.setItem(

   KEY,

   JSON.stringify(data)

  );


  return true;

 }

 catch(e){

  alert(
   'Browser Storage unavailable। Backup ব্যবহার করুন।'
  );

  return false;

 }

}



/* =====================================================
   SAVE ENTRY
   ===================================================== */

function saveEntry(){

 let x = {};


 ids.forEach(id => {

  x[id] = val(id);

 });


 if(
  !x.scheme &&
  !x.startDag
 ){

  alert(
   'Scheme Name অথবা Starting Dag No. দিন।'
  );

  return;

 }


 if(editIndex >= 0){

  data[editIndex] = x;

 }

 else{

  data.push(x);

 }


 if(!persist())
  return;


 render();


 clearForm();


 alert(
  'Entry Save হয়েছে ✓'
 );

}



/* =====================================================
   CLEAR FORM
   ===================================================== */

function clearForm(){

 ids.forEach(id => {

  $(id).value = '';

 });


 $('mouza').value =
  'Sahara';


 editIndex = -1;


 $('formTitle').textContent =
  '➕ নতুন Data Entry';

}



/* =====================================================
   EDIT
   ===================================================== */

function edit(i){

 const x =
  data[i];


 ids.forEach(id => {

  $(id).value =
   x[id] || '';

 });


 editIndex = i;


 $('formTitle').textContent =
  '✏️ Data Entry Edit করুন';


 window.scrollTo({

  top:0,

  behavior:'smooth'

 });

}



/* =====================================================
   DELETE ONE
   ===================================================== */

function del(i){

 if(
  confirm(
   'এই Entry মুছে ফেলবেন?'
  )
 ){

  data.splice(i,1);

  persist();

  render();

 }

}



/* =====================================================
   RENDER TABLE
   ===================================================== */

function render(){

 const q =
  val('search').toLowerCase();


 const list =
  data

  .map((x,i)=>({

   x,
   i

  }))

  .filter(o =>

   JSON.stringify(o.x)
    .toLowerCase()
    .includes(q)

  );


 $('count').textContent =
  list.length + ' entries';


 $('tbody').innerHTML =

  list.length

  ?

  list.map((o,n)=>{

   const x = o.x;

   const i = o.i;


   const cells = [

    'scheme',

    'nature',

    'lengthArea',

    'mouza',

    'startDag',

    'endDag',

    'jobCard',

    'lat1',

    'long1',

    'lat2',

    'long2'

   ];


   return (

    '<tr>' +

    '<td>' +

    (n+1) +

    '</td>' +


    cells.map(

     id =>

      '<td>' +

      esc(x[id]) +

      '</td>'

    ).join('') +


    '<td>' +


    '<button ' +

    'class="actionbtn primary" ' +

    'onclick="edit(' +

    i +

    ')">' +

    'Edit' +

    '</button>' +


    '<button ' +

    'class="actionbtn danger" ' +

    'onclick="del(' +

    i +

    ')">' +

    'Delete' +

    '</button>' +


    '</td>' +


    '</tr>'

   );

  }).join('')


  :


  '<tr>' +

  '<td colspan="13" class="empty">' +

  'কোনো Data Entry নেই।' +

  '</td>' +

  '</tr>';

}



/* =====================================================
   EXCEL ESCAPE
   ===================================================== */

function excelEsc(s){

 return String(s ?? '')

  .replace(
   /&/g,
   '&amp;'
  )

  .replace(
   /</g,
   '&lt;'
  )

  .replace(
   />/g,
   '&gt;'
  )

  .replace(
   /"/g,
   '&quot;'
  )

  .replace(
   /'/g,
   '&apos;'
  );

}



/* =====================================================
   EXCEL CELL
   ===================================================== */

function excelCell(

 s,

 style='Cell',

 merge=''

){

 return (

  '<Cell ss:StyleID="' +

  style +

  '"' +

  (

   merge !== ''

   ?

   ' ss:MergeAcross="' +

   merge +

   '"'

   :

   ''

  ) +

  '>' +

  '<Data ss:Type="String">' +

  excelEsc(s)

   .replace(
    /\n/g,
    '&#10;'
   ) +

  '</Data>' +

  '</Cell>'

 );

}



/* =====================================================
   EXPORT EXCEL
   ===================================================== */

function exportExcel(){

 if(!data.length){

  alert(
   'Export করার মতো Data নেই।'
  );

  return;

 }



/* =================================================
   EXCEL HEADERS
   ================================================= */

 const headers = [

  'S.L.\nNo.',

  'Scheme Name',

  'Nature of\nWork',

  'Length /\nArea',

  'Mouja',

  'Starting\nDag No.',

  'End Dag\nNo.',

  'In Case I.B.S\nJob Card\nNo.',

  'Lat',

  'Long',

  'Lat',

  'Long'

 ];



/* =================================================
   COMPACT COLUMN WIDTHS
   ================================================= */

 const widths = [

  32,

  125,

  72,

  55,

  58,

  60,

  60,

  78,

  38,

  42,

  38,

  42

 ];



/* =================================================
   XML START
   ================================================= */

 let xml =

 '<?xml version="1.0" encoding="UTF-8"?>' +

 '<?mso-application progid="Excel.Sheet"?>' +

 '<Workbook ' +

 'xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +

 'xmlns:o="urn:schemas-microsoft-com:office:office" ' +

 'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +

 'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">';



/* =================================================
   STYLES
   ================================================= */

 xml +=

 '<Styles>' +



 '<Style ' +

 'ss:ID="Default" ' +

 'ss:Name="Normal">' +

 '<Alignment ss:Vertical="Center"/>' +

 '<Font ' +

 'ss:FontName="Arial" ' +

 'ss:Size="9"/>' +

 '</Style>' +



 '<Style ss:ID="Title">' +

 '<Alignment ' +

 'ss:Horizontal="Center" ' +

 'ss:Vertical="Center" ' +

 'ss:WrapText="1"/>' +

 '<Font ' +

 'ss:FontName="Arial" ' +

 'ss:Size="14" ' +

 'ss:Bold="1"/>' +

 '</Style>' +



 '<Style ss:ID="Header">' +

 '<Alignment ' +

 'ss:Horizontal="Center" ' +

 'ss:Vertical="Center" ' +

 'ss:WrapText="1"/>' +

 '<Font ' +

 'ss:FontName="Arial" ' +

 'ss:Size="10" ' +

 'ss:Bold="1"/>' +

 '<Borders>' +

 '<Border ' +

 'ss:Position="Bottom" ' +

 'ss:LineStyle="Continuous" ' +

 'ss:Weight="1"/>' +

 '<Border ' +

 'ss:Position="Left" ' +

 'ss:LineStyle="Continuous" ' +

 'ss:Weight="1"/>' +

 '<Border ' +

 'ss:Position="Right" ' +

 'ss:LineStyle="Continuous" ' +

 'ss:Weight="1"/>' +

 '<Border ' +

 'ss:Position="Top" ' +

 'ss:LineStyle="Continuous" ' +

 'ss:Weight="1"/>' +

 '</Borders>' +

 '</Style>' +



 '<Style ss:ID="Cell">' +

 '<Alignment ' +

 'ss:Horizontal="Center" ' +

 'ss:Vertical="Center" ' +

 'ss:WrapText="1"/>' +

 '<Font ' +

 'ss:FontName="Arial" ' +

 'ss:Size="9"/>' +

 '<Borders>' +

 '<Border ' +

 'ss:Position="Bottom" ' +

 'ss:LineStyle="Continuous" ' +

 'ss:Weight="1"/>' +

 '<Border ' +

 'ss:Position="Left" ' +

 'ss:LineStyle="Continuous" ' +

 'ss:Weight="1"/>' +

 '<Border ' +

 'ss:Position="Right" ' +

 'ss:LineStyle="Continuous" ' +

 'ss:Weight="1"/>' +

 '<Border ' +

 'ss:Position="Top" ' +

 'ss:LineStyle="Continuous" ' +

 'ss:Weight="1"/>' +

 '</Borders>' +

 '</Style>' +


 '</Styles>';



/* =================================================
   WORKSHEET
   ================================================= */

 xml +=

 '<Worksheet ss:Name="AAP Format">' +

 '<Table ' +

 'ss:ExpandedColumnCount="12" ' +

 'ss:ExpandedRowCount="' +

 (data.length + 2) +

 '" ' +

 'x:FullColumns="1" ' +

 'x:FullRows="1">';



/* =================================================
   COLUMN WIDTHS
   ================================================= */

 xml +=

 widths.map(

  w =>

   '<Column ' +

   'ss:Width="' +

   w +

   '" ' +

   'ss:AutoFitWidth="1"/>'


 ).join('');



/* =================================================
   TITLE
   ================================================= */

 xml +=

 '<Row ss:Height="32">' +

 excelCell(

  'A. A. P Format of V. B. G. R. A. M. G',

  'Title',

  '11'

 ) +

 '</Row>';



/* =================================================
   HEADER
   ================================================= */

 xml +=

 '<Row ss:Height="62">' +

 headers.map(

  h =>

   excelCell(

    h,

    'Header'

   )

 ).join('') +

 '</Row>';



/* =================================================
   DATA ROWS
   ================================================= */

 data.forEach((x,n)=>{


  /* -----------------------------------------------
     MOUJA CAPITAL
     ----------------------------------------------- */

  const moujaName =

   String(
    x.mouza || ''
   ).toUpperCase();



  /* -----------------------------------------------
     12 COLUMNS
     ----------------------------------------------- */

  const row = [

   n + 1,

   x.scheme || '',

   x.nature || '',

   x.lengthArea || '',

   moujaName,

   x.startDag || '',

   x.endDag || '',

   x.jobCard || '',

   x.lat1 || '',

   x.long1 || '',

   x.lat2 || '',

   x.long2 || ''

  ];



  /* -----------------------------------------------
     AUTO ROW HEIGHT
     ----------------------------------------------- */

  let maxLines = 1;


  row.forEach(

   (value,index)=>{

    const text =
     String(value ?? '');


    let charsPerLine = 8;


    /*
     Scheme Name
    */

    if(index === 1){

     charsPerLine = 17;

    }


    /*
     Nature of Work
    */

    else if(index === 2){

     charsPerLine = 10;

    }


    /*
     Length / Area
    */

    else if(index === 3){

     charsPerLine = 8;

    }


    /*
     Mouja
    */

    else if(index === 4){

     charsPerLine = 9;

    }


    /*
     Starting / End Dag
    */

    else if(
     index === 5 ||
     index === 6
    ){

     charsPerLine = 8;

    }


    /*
     Job Card
    */

    else if(index === 7){

     charsPerLine = 11;

    }


    /*
     Lat / Long
    */

    else{

     charsPerLine = 8;

    }


    const calculated =

     Math.ceil(
      text.length /
      charsPerLine
     );


    const manualLines =

     text.split(/\n/).length;


    maxLines = Math.max(

     maxLines,

     calculated,

     manualLines

    );

   }

  );



  /*
   Blank / short data হলে
   row ছোট থাকবে।

   বড় text হলে row বড় হবে।

   Maximum 75.
  */

  const rowHeight =

   Math.max(

    20,

    Math.min(

     75,

     14 +
     maxLines * 9

    )

   );



  xml +=

   '<Row ' +

   'ss:AutoFitHeight="1" ' +

   'ss:Height="' +

   rowHeight +

   '">' +


   row.map(

    v =>

     excelCell(

      v,

      'Cell'

     )

   ).join('') +


   '</Row>';

 });



/* =================================================
   PAGE SETUP
   ================================================= */

 xml +=

 '</Table>' +


 '<WorksheetOptions ' +

 'xmlns="urn:schemas-microsoft-com:office:excel">' +


 '<PageSetup>' +


 '<Layout ' +

 'x:Orientation="Landscape" ' +

 'x:CenterHorizontal="1" ' +

 'x:CenterVertical="0"/>' +


 '<PageMargins ' +

 'x:Bottom="0.20" ' +

 'x:Left="0.15" ' +

 'x:Right="0.15" ' +

 'x:Top="0.20"/>' +


 '</PageSetup>' +


 '<FitToPage/>' +


 '<Print>' +

 '<ValidPrinterInfo/>' +

 '<Gridlines>False</Gridlines>' +

/* =====================================================
   BACKUP
   ===================================================== */

function backup(){

 download(

  new Blob(

   [

    JSON.stringify(

     data,

     null,

     2

    )

   ],

   {
    type:'application/json'
   }

  ),

  'AAP_Data_Backup.json'

 );

}



/* =====================================================
   RESTORE
   ===================================================== */

function restore(e){

 const f =
  e.target.files[0];


 if(!f)
  return;


 const r =
  new FileReader();


 r.onload = ()=>{

  try{

   const x =
    JSON.parse(r.result);


   if(!Array.isArray(x))
    throw 1;


   data = x;


   if(!persist())
    throw 2;


   render();


   alert(
    'Backup Restore হয়েছে ✓'
   );

  }

  catch(z){

   alert(
    'সঠিক Backup file নয়।'
   );

  }

 };


 r.readAsText(f);


 e.target.value = '';

}



/* =====================================================
   DELETE ALL
   ===================================================== */

function deleteAll(){

 if(

  data.length &&

  confirm(
   'সব Data মুছে ফেলবেন?'
  )

 ){

  data = [];

  persist();

  render();

  clearForm();

 }

}



/* =====================================================
   DOWNLOAD
   ===================================================== */

function download(
 blob,
 name
){

 const a =
  document.createElement('a');


 a.href =
  URL.createObjectURL(blob);


 a.download =
  name;


 document.body.appendChild(a);


 a.click();


 setTimeout(()=>{

  URL.revokeObjectURL(
   a.href
  );

  a.remove();

 },1000);

}



/* =====================================================
   START
   ===================================================== */

load();
