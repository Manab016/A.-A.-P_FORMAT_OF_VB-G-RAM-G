<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A.A.P Offline Data Entry</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f1f5f9;
    color:#17212b;
    font-family:"Noto Sans Bengali","Nirmala UI",Arial,sans-serif;
    font-size:15px;
}

header{
    background:#17324d;
    color:white;
    padding:18px 12px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:21px;
    font-weight:800;
}

header p{
    margin:5px 0 0;
    font-size:12px;
}

.yearText{
    margin-top:5px;
    font-size:12px;
    font-weight:700;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:10px;
}

.card{
    background:white;
    border:1px solid #d6dee6;
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
}

.title{
    font-size:17px;
    font-weight:800;
    padding:14px;
    border-bottom:1px solid #e1e7ec;
}

.topbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:12px;
}

.topbar label{
    display:block;
    font-weight:800;
    font-size:13px;
    margin-bottom:5px;
}

.formnav{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:10px 12px;
}

.formnav button{
    min-height:45px;
}

button{
    font:inherit;
    font-weight:800;
    border:0;
    border-radius:9px;
    padding:11px 13px;
    cursor:pointer;
    min-height:44px;
}

.primary{
    background:#1769aa;
    color:white;
}

.success{
    background:#198754;
    color:white;
}

.danger{
    background:#c0392b;
    color:white;
}

.gray{
    background:#e8edf2;
    color:#17212b;
}

.secondary{
    background:#eef4f8;
    color:#17324d;
    border:1px solid #ccd8e2;
}

.formnav button.active,
.stagebar button.active{
    background:#1769aa;
    color:white;
}

.stagebar{
    display:none;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    padding:0 12px 10px;
}

.stagebar.show{
    display:grid;
}

.notice{
    margin:0 12px 12px;
    padding:10px;
    background:#eaf5ff;
    border:1px solid #c8e1f5;
    border-radius:9px;
    font-size:13px;
    font-weight:700;
    color:#174d73;
}

.form{
    padding:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.field{
    width:100%;
}

.field label{
    display:block;
    font-weight:800;
    font-size:14px;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #bdc8d2;
    border-radius:9px;
    background:white;
    font:inherit;
    outline:none;
}

input:focus,
select:focus{
    border-color:#1769aa;
}

.hint{
    font-size:11px;
    color:#777;
    font-weight:500;
}

.approveSection{
    grid-column:1/-1;
    margin-top:4px;
    padding:12px;
    border:2px solid #1769aa;
    border-radius:10px;
    background:#f7fbff;
}

.approveSectionTitle{
    font-size:16px;
    font-weight:900;
    color:#1769aa;
    margin-bottom:10px;
}

.approveGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.hidden{
    display:none !important;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:12px;
}

.toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:12px;
}

.search{
    grid-column:1/-1;
}

.transferbar{
    display:none;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:10px 12px;
    background:#fff8e6;
    border-top:1px solid #ead8a8;
}

.transferbar.show{
    display:grid;
}

.selectedInfo{
    padding:8px 12px;
    text-align:center;
    font-weight:800;
    color:#a56800;
    font-size:13px;
}

.count{
    text-align:center;
    font-weight:800;
    color:#198754;
    padding:8px;
}

.tablebox{
    overflow:auto;
    padding:0 8px 12px;
}

table{
    border-collapse:collapse;
    width:100%;
    min-width:1500px;
    font-size:12px;
}

th,
td{
    border:1px solid #aeb8c2;
    padding:7px;
    vertical-align:top;
}

th{
    background:#e8eef3;
    text-align:center;
    font-weight:900;
    white-space:nowrap;
}

td{
    overflow-wrap:anywhere;
    word-break:break-word;
}

.selectCell{
    text-align:center;
}

.rowcheck,
.selectAll{
    width:20px;
    height:20px;
    cursor:pointer;
}

.actionbtn{
    padding:7px 9px;
    min-height:34px;
    font-size:12px;
    margin:2px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#687681;
}

@media(max-width:700px){

    .form{
        grid-template-columns:1fr;
    }

    .topbar{
        grid-template-columns:1fr;
    }

    .formnav{
        grid-template-columns:1fr 1fr;
    }

    .stagebar{
        grid-template-columns:1fr;
    }

    .approveGrid{
        grid-template-columns:1fr;
    }

    .actions,
    .toolbar{
        grid-template-columns:1fr 1fr;
    }

    input,
    select{
        font-size:16px;
    }

}

</style>
</head>

<script>


/* =========================================
   STORAGE
========================================= */

const STORAGE_KEY =
"AAP_OFFLINE_DATA_MOBILE_V9";


const OLD_KEYS = [

"AAP_OFFLINE_DATA_MOBILE_V8",
"AAP_OFFLINE_DATA_MOBILE_V7",
"AAP_OFFLINE_DATA_MOBILE_V6",
"AAP_OFFLINE_DATA_MOBILE_V5",
"AAP_OFFLINE_DATA_MOBILE_V4",
"AAP_OFFLINE_DATA_MOBILE_V3",
"AAP_OFFLINE_DATA_MOBILE_V2",
"AAP_OFFLINE_DATA",
"AAP_DATA",
"AAP_OFFLINE_DATA_MOBILE",
"AAP_OFFLINE_DATA_MOBILE_V1"

];



/* =========================================
   FORM NAMES
========================================= */

const FORM_NAMES = {

approach:
"Approach Scheme",

approve:
"Approve Scheme",

tender:
"Tender Scheme",

modelVillage:
"Model Village Approach",

modelApprove:
"Model Village Approve",

modelTender:
"Model Village Tender"

};



/* =========================================
   FLOW
========================================= */

const FLOW = {

approach:{
next:"approve",
back:null
},

approve:{
next:"tender",
back:"approach"
},

tender:{
next:null,
back:"approve"
},

modelVillage:{
next:"modelApprove",
back:null
},

modelApprove:{
next:"modelTender",
back:"modelVillage"
},

modelTender:{
next:null,
back:"modelApprove"
}

};



/* =========================================
   BASE FIELDS
========================================= */

const BASE_IDS = [

"scheme",
"nature",
"lengthArea",
"mouza",
"startDag",
"endDag",
"jobCard",
"lat1",
"long1",
"lat2",
"long2"

];



/* =========================================
   STATE
========================================= */

function defaultState(){

return {

version:9,

year:"2026-27",

forms:{

approach:[],
approve:[],
tender:[],

modelVillage:[],
modelApprove:[],
modelTender:[]

}

};

}


let state =
defaultState();


let currentForm =
"approach";


let editIndex =
-1;



/* =========================================
   HELPER
========================================= */

function $(id){

return document.getElementById(id);

}


function val(id){

const e =
$(id);

return e
?
e.value.trim()
:
"";

}


function todayISO(){

const d =
new Date();

return new Date(
d.getTime() -
d.getTimezoneOffset()*60000
)
.toISOString()
.slice(0,10);

}


function createId(){

return Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2);

}


function esc(s){

return String(s ?? "")
.replace(
/[&<>"']/g,

function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c];

});

}


function isApproval(form){

return (
form === "approve" ||
form === "modelApprove"
);

}


function isTender(form){

return (
form === "tender" ||
form === "modelTender"
);
}


function isModel(form){

return form.indexOf("model") === 0;

}


function currentData(){

return state.forms[currentForm];

}


function formName(){

return FORM_NAMES[currentForm];

}



/* =========================================
   NORMALIZE ENTRY
========================================= */

function normalizeEntry(x){

x = x || {};

return {

id:
String(
x.id ||
createId()
),

scheme:
String(
x.scheme ||
""
),

nature:
String(
x.nature ||
""
),

lengthArea:
String(
x.lengthArea ||
""
),

mouza:
String(
x.mouza ||
"Sahara"
),

startDag:
String(
x.startDag ||
""
),

endDag:
String(
x.endDag ||
""
),

jobCard:
String(
x.jobCard ||
""
),

lat1:
String(
x.lat1 ||
""
),

long1:
String(
x.long1 ||
""
),

lat2:
String(
x.lat2 ||
""
),

long2:
String(
x.long2 ||
""
),

date:
String(
x.date ||
""
),

year:
String(
x.year ||
""
),

sector:
String(
x.sector ||
""
),

estimateCost:
String(
x.estimateCost ||
""
),

fund:
String(
x.fund ||
""
),

newSL:
String(
x.newSL ||
""
),

_backSnapshot:
x._backSnapshot ||
null

};

}



/* =========================================
   NORMALIZE STATE
========================================= */

function normalizeState(input){

const result =
defaultState();


if(
Array.isArray(input)
){

result.forms.approach =
input.map(
normalizeEntry
);

return result;

}


if(
input &&
typeof input === "object"
){

result.year =
String(
input.year ||
"2026-27"
);


if(
input.forms &&
typeof input.forms === "object"
){

Object.keys(
result.forms
)
.forEach(
function(k){

if(
Array.isArray(
input.forms[k]
)
){

result.forms[k] =
input.forms[k]
.map(
normalizeEntry
);

}

});

}

else if(
Array.isArray(input.data)
){

result.forms.approach =
input.data.map(
normalizeEntry
);

}

}


return result;

}



/* =========================================
   SAVE STORAGE
========================================= */

function persist(){

try{

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(state)
);

return true;

}

catch(e){

alert(
"Browser Storage unavailable. Backup ব্যবহার করুন।"
);

return false;

}

}



/* =========================================
   LOAD
========================================= */

function load(){

let found =
false;


try{

const raw =
localStorage.getItem(
STORAGE_KEY
);


if(raw){

state =
normalizeState(
JSON.parse(raw)
);

found =
true;

}

else{

for(
let i=0;
i<OLD_KEYS.length;
i++
){

const old =
localStorage.getItem(
OLD_KEYS[i]
);

if(old){

try{

state =
normalizeState(
JSON.parse(old)
);

persist();

found =
true;

break;

}

catch(e){}

}

}

}

}

catch(e){}


if(!found){

state =
defaultState();

}


$("year").value =
state.year ||
"2026-27";


$("entryDate").value =
todayISO();


updateUI();

}



/* =========================================
   SWITCH FORM
========================================= */

function switchForm(form){

if(!FORM_NAMES[form])
return;


currentForm =
form;


editIndex =
-1;


document
.querySelectorAll(
".formnav button"
)
.forEach(
function(b){

b.classList.remove("active");

b.classList.add("secondary");

});


let mainButton =
null;


if(form === "approach")
mainButton =
$("nav-approach");


if(form === "approve")
mainButton =
$("nav-approve");


if(form === "tender")
mainButton =
$("nav-tender");


if(isModel(form))
mainButton =
$("nav-model");


if(mainButton){

mainButton.classList.add("active");

mainButton.classList.remove("secondary");

}


$("modelStageBar")
.classList.toggle(
"show",
isModel(form)
);


document
.querySelectorAll(
"#modelStageBar button"
)
.forEach(
function(b){

b.classList.remove("active");

b.classList.add("secondary");

});


if(isModel(form)){

let id =
"stage-modelVillage";


if(form === "modelApprove")
id =
"stage-modelApprove";


if(form === "modelTender")
id =
"stage-modelTender";


$(id).classList.add("active");

$(id).classList.remove("secondary");

}


updateUI();

clearForm(false);

render();

}



/* =========================================
   UPDATE UI
========================================= */

function updateUI(){

$("headerYear")
.textContent =
String(state.year)
.replace("-"," - ");


$("currentFormName")
.textContent =
formName();


$("formTitle")
.textContent =
"➕ " +
formName() +
" — নতুন Data Entry";


$("savedTitle")
.textContent =
"📋 " +
formName() +
" — Saved Data";


$("appHeading")
.textContent =
isModel(currentForm)
?
"MODEL VILLAGE"
:
"A.A.P Offline Data Entry";


$("approvalSection")
.classList.toggle(
"hidden",
!isApproval(currentForm)
);


$("tenderSection")
.classList.toggle(
"hidden",
!isTender(currentForm)
);


updateTransferButtons();

}



/* =========================================
   YEAR
========================================= */

function changeYear(){

state.year =
$("year").value;


$("headerYear")
.textContent =
state.year.replace(
"-",
" - "
);


persist();

render();

}



/* =========================================
   CLEAR
========================================= */

function clearForm(
resetDate=true
){

BASE_IDS.forEach(
function(id){

$(id).value = "";

});


$("sector").value = "";

$("estimateCost").value = "";

$("fund").value = "";

$("newSL").value = "";

$("tenderEstimateCost").value = "";


$("mouza").value =
"Sahara";


editIndex =
-1;


$("formTitle")
.textContent =
"➕ " +
formName() +
" — নতুন Data Entry";


if(resetDate){

$("entryDate").value =
todayISO();

}

}



/* =========================================
   SAVE ENTRY
========================================= */

function saveEntry(){

const x = {};


BASE_IDS.forEach(
function(id){

x[id] =
val(id);

});


x.date =
val("entryDate") ||
todayISO();


x.year =
state.year;


/*
 APPROVE
*/

if(
isApproval(currentForm)
){

x.sector =
val("sector");

x.estimateCost =
val("estimateCost");

x.fund =
val("fund");

x.newSL =
val("newSL");

}


/*
 TENDER
*/

else if(
isTender(currentForm)
){

x.sector = "";

x.fund = "";

x.newSL = "";

x.estimateCost =
val("tenderEstimateCost");

}


/*
 APPROACH
*/

else{

x.sector = "";

x.estimateCost = "";

x.fund = "";

x.newSL = "";

}


if(
!x.scheme &&
!x.startDag
){

alert(
"Scheme Name অথবা Starting Dag No. দিন।"
);

return;

}


const arr =
currentData();


if(editIndex >= 0){

x.id =
arr[editIndex].id ||
createId();


x._backSnapshot =
arr[editIndex]._backSnapshot ||
null;


arr[editIndex] =
normalizeEntry(x);

}

else{

x.id =
createId();

x._backSnapshot =
null;


arr.push(
normalizeEntry(x)
);

}


if(!persist())
return;


render();

clearForm();

alert(
formName() +
" Entry Save হয়েছে ✓"
);

}



/* =========================================
   EDIT
========================================= */

function edit(i){

const x =
currentData()[i];


if(!x)
return;


BASE_IDS.forEach(
function(id){

$(id).value =
x[id] || "";

});


$("entryDate").value =
x.date ||
todayISO();


$("sector").value =
x.sector ||
"";


$("estimateCost").value =
x.estimateCost ||
"";


$("fund").value =
x.fund ||
"";


$("newSL").value =
x.newSL ||
"";


$("tenderEstimateCost").value =
x.estimateCost ||
"";


editIndex =
i;


updateUI();


$("formTitle")
.textContent =
"✏️ " +
formName() +
" — Data Entry Edit করুন";


window.scrollTo({
top:0,
behavior:"smooth"
});

}



/* =========================================
   DELETE ROW
========================================= */

function del(i){

if(
confirm(
formName() +
" এর এই Entry মুছে ফেলবেন?"
)
){

currentData()
.splice(i,1);

persist();

render();

}

}



/* =========================================
   DELETE CURRENT
========================================= */

function deleteCurrentForm(){

if(!currentData().length){

alert(
formName() +
" এ কোনো data নেই।"
);

return;

}


if(
confirm(
formName() +
" এর সব data মুছে ফেলবেন?"
)
){

state.forms[currentForm] = [];

editIndex =
-1;

persist();

clearForm();

render();

}

}



/* =========================================
   DELETE ALL
========================================= */

function deleteAll(){

let total = 0;


Object
.values(state.forms)
.forEach(
function(a){

total +=
a.length;

});


if(!total){

alert(
"কোনো Data নেই।"
);

return;

}


if(
confirm(
"সব Form-এর সব Data একসাথে মুছে ফেলবেন?"
)
){

Object.keys(
state.forms
)
.forEach(
function(k){

state.forms[k] = [];

});


persist();

clearForm();

render();

}

}



/* =========================================
   SELECTED INDEXES
========================================= */

function getSelectedIndexes(){

return Array
.from(
document.querySelectorAll(
".rowcheck:checked"
)
)
.map(
function(e){

return Number(
e.dataset.index
);

});

}



function toggleAll(box){

document
.querySelectorAll(
".rowcheck"
)
.forEach(
function(cb){

cb.checked =
box.checked;

});


updateSelectedInfo();

}



function updateSelectedInfo(){

const n =
getSelectedIndexes()
.length;


$("selectedInfo")
.textContent =
n
?
n +
" টি Project Select করা হয়েছে"
:
"কোনো Project Select করা হয়নি";

}



/* =========================================
   TRANSFER BUTTON UPDATE
========================================= */

function updateTransferButtons(){

const flow =
FLOW[currentForm];


const bar =
$("transferBar");


bar.classList.toggle(
"show",
!!(
flow.next ||
flow.back
)
);


const next =
$("nextTransferBtn");


const back =
$("backTransferBtn");


if(flow.next){

next.style.display =
"block";


next.textContent =
"➡ " +
FORM_NAMES[flow.next] +
" -এ Transfer";

else{

next.style.display =
"none";

}


if(flow.back){

back.style.display =
"block";


back.textContent =
"⬅ " +
FORM_NAMES[flow.back] +
" -এ Back";

}

else{

back.style.display =
"none";

}

}



/* =========================================
   APPROACH -> APPROVE
========================================= */

function copyToApprove(r){

const x =
normalizeEntry(r);


/*
 Approach-এর data যাবে।
 Approve-এর নতুন চারটি field
 blank থাকবে।
*/

x.sector = "";

x.estimateCost = "";

x.fund = "";

x.newSL = "";

x._backSnapshot = null;


return x;

}



/* =========================================
   APPROVE -> TENDER
========================================= */

function copyApproveToTender(r){

const x =
normalizeEntry(r);


/*
 Approve-এর সব data snapshot
 হিসেবে সংরক্ষণ করছি।
*/

const snapshot = {

id:x.id,

scheme:x.scheme,

nature:x.nature,

lengthArea:x.lengthArea,

mouza:x.mouza,

startDag:x.startDag,

endDag:x.endDag,

jobCard:x.jobCard,

lat1:x.lat1,

long1:x.long1,

lat2:x.lat2,

long2:x.long2,

date:x.date,

year:x.year,

sector:x.sector,

estimateCost:x.estimateCost,

fund:x.fund,

newSL:x.newSL

};


/*
 Tender-এ শুধু Estimated Cost থাকবে।
*/

x.sector = "";

x.fund = "";

x.newSL = "";

x.estimateCost =
r.estimateCost || "";


/*
 Back করার সময় এই snapshot
 ব্যবহার হবে।
*/

x._backSnapshot =
snapshot;


return x;

}



/* =========================================
   TENDER -> APPROVE
========================================= */

function copyTenderToApprove(r){

if(r._backSnapshot){

const x =
normalizeEntry(
r._backSnapshot
);


/*
 Tender-এ Estimated Cost পরিবর্তন
 হয়ে থাকলে সেটা Approve-এও থাকবে।
*/

x.estimateCost =
r.estimateCost ||
x.estimateCost ||
"";


return x;

}


/*
 পুরনো data-এর জন্য fallback
*/

const x =
normalizeEntry(r);

x.sector = "";

x.fund = "";

x.newSL = "";


return x;

}



/* =========================================
   APPROVE -> APPROACH BACK
========================================= */

function copyApproveToApproach(r){

const x =
normalizeEntry(r);


/*
 Approach-এ approval-এর
 নতুন fields থাকবে না।
*/

x.sector = "";

x.estimateCost = "";

x.fund = "";

x.newSL = "";

x._backSnapshot = null;


return x;

}



/* =========================================
   TRANSFER NEXT
========================================= */

function transferNext(){

const flow =
FLOW[currentForm];


if(
!flow ||
!flow.next
){

alert(
"এই Stage-এর পরে আর কোনো Stage নেই।"
);

return;

}


const selected =
getSelectedIndexes();


if(!selected.length){

alert(
"আগে অন্তত ১টি Project Select করুন।"
);

return;

}


const source =
state.forms[currentForm];


const target =
state.forms[flow.next];


const records =
selected
.map(
function(i){

return source[i];

})
.filter(Boolean);


if(!records.length){

alert(
"Selected data পাওয়া যায়নি।"
);

return;

}


if(
!confirm(
records.length +
" টি Project\n\n" +
formName() +
" থেকে\n" +
FORM_NAMES[flow.next] +
" -এ Transfer করবেন?"
)
){

return;

}


records.forEach(
function(r){

let x;


/*
 ========================================
 APPROACH -> APPROVE
 ========================================
*/

if(
currentForm === "approach" &&
flow.next === "approve"
){

x =
copyToApprove(r);

}


/*
 ========================================
 APPROVE -> TENDER
 ========================================
*/

else if(
currentForm === "approve" &&
flow.next === "tender"
){

x =
copyApproveToTender(r);

}


/*
 ========================================
 MODEL APPROACH -> MODEL APPROVE
 ========================================
*/

else if(
currentForm === "modelVillage" &&
flow.next === "modelApprove"
){

x =
copyToApprove(r);

}


/*
 ========================================
 MODEL APPROVE -> MODEL TENDER
 ========================================
*/

else if(
currentForm === "modelApprove" &&
flow.next === "modelTender"
){

x =
copyApproveToTender(r);

}

else{

x =
normalizeEntry(r);

}


/*
 Target-এ একই ID আগে থাকলে
 duplicate করবে না।
*/

const exists =
target.some(
function(t){

return t.id === x.id;

});


if(!exists){

target.push(x);

}

});


/*
 Source থেকে selected data remove
*/

selected
.sort(
function(a,b){

return b-a;

})
.forEach(
function(i){

source.splice(i,1);

});


editIndex =
-1;


persist();

render();


alert(
records.length +
" টি Project সফলভাবে\n" +
FORM_NAMES[flow.next] +
" -এ Transfer হয়েছে ✓"
);

}

/* =========================================
   TABLE COLUMNS
========================================= */

function columns(){

const base = [

["S.L. No.","auto"],

["Date","date"],

["Financial Year","year"],

["Scheme Name","scheme"],

["Nature of Work","nature"],

["Length / Area","lengthArea"],

["Mouja","mouza"],

["Starting Dag No.","startDag"],

["End Dag No.","endDag"],

["In Case I.B.S Job Card No.","jobCard"],

["Lat","lat1"],

["Long","long1"],

["Lat","lat2"],

["Long","long2"]

];


/*
 Approve list-এ চারটি field
*/

if(
isApproval(currentForm)
){

base.push(

["Sector","sector"],

["Estimated Cost","estimateCost"],

["Fund","fund"],

["New S.L. No.","newSL"]

);

}


/*
 Tender list-এ শুধু Estimated Cost
*/

if(
isTender(currentForm)
){

base.push(

["Estimated Cost","estimateCost"]

);

}


return base;

}



/* =========================================
   RENDER TABLE
========================================= */

function render(){

const q =
val("search")
.toLowerCase();


const list =
currentData()
.map(
function(x,i){

return {

x:x,

i:i

};

})
.filter(
function(o){

return JSON.stringify(
o.x
)
.toLowerCase()
.includes(q);

});


const cols =
columns();


$("count")
.textContent =
list.length +
" entries — " +
formName();


$("thead").innerHTML =

"<tr>" +

"<th>" +

'<input type="checkbox" class="selectAll" onchange="toggleAll(this)">' +

"<br>Select" +

"</th>" +

cols
.map(
function(c){

return "<th>" +
esc(c[0]) +
"</th>";

})
.join("") +

"<th>Action</th>" +

"</tr>";


if(!list.length){

$("tbody").innerHTML =

"<tr>" +

'<td colspan="' +
(cols.length+2) +
'" class="empty">' +

esc(formName()) +

" এ কোনো Data Entry নেই।" +

"</td>" +

"</tr>";


updateSelectedInfo();

return;

}


$("tbody").innerHTML =

list
.map(
function(o,n){

const x =
o.x;


return (

"<tr>" +

'<td class="selectCell">' +

'<input type="checkbox" class="rowcheck" data-index="' +
o.i +
'" onchange="updateSelectedInfo()">' +

"</td>" +


cols
.map(
function(c){

let value;


if(
c[1] === "auto"
){

value =
n+1;

}

else if(
c[1] === "mouza"
){

value =
String(
x[c[1]] ||
""
)
.toUpperCase();

}

else{

value =
x[c[1]] ||
"";

}


return "<td>" +
esc(value) +
"</td>";

})
.join("") +


"<td>" +

'<button class="actionbtn primary" onclick="edit(' +
o.i +
')">Edit</button>' +

'<button class="actionbtn danger" onclick="del(' +
o.i +
')">Delete</button>' +

"</td>" +

"</tr>"

);

})
.join("");


updateSelectedInfo();

}



/* =========================================
   EXCEL ESCAPE
========================================= */

function excelEsc(s){

return String(s ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&apos;");

}



/* =========================================
   EXCEL EXPORT
========================================= */

function exportExcel(){

const data =
currentData();


if(!data.length){

alert(
formName() +
" এ Export করার মতো Data নেই।"
);

return;

}


const cols =
columns();


let xml =

'<?xml version="1.0" encoding="UTF-8"?>' +

'<?mso-application progid="Excel.Sheet"?>' +

'<Workbook ' +

'xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +

'xmlns:o="urn:schemas-microsoft-com:office:office" ' +

'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +

'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +


"<Styles>" +

'<Style ss:ID="Default" ss:Name="Normal">' +

'<Alignment ss:Vertical="Center"/>' +

'<Font ss:FontName="Arial" ss:Size="9"/>' +

"</Style>" +


'<Style ss:ID="Title">' +

'<Alignment ss:Horizontal="Center" ss:Vertical="Center"/>' +

'<Font ss:FontName="Arial" ss:Size="14" ss:Bold="1"/>' +

"</Style>" +


'<Style ss:ID="Header">' +

'<Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/>' +

'<Font ss:FontName="Arial" ss:Size="10" ss:Bold="1"/>' +

"</Style>" +


'<Style ss:ID="Cell">' +

'<Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/>' +

'<Font ss:FontName="Arial" ss:Size="9"/>' +

"</Style>" +

"</Styles>" +


'<Worksheet ss:Name="' +
excelEsc(
formName().substring(0,31)
) +
'">' +


'<Table ss:ExpandedColumnCount="' +
cols.length +
'">';


/*
 TITLE
*/

xml +=

"<Row>" +

"<Cell ss:MergeAcross=\"" +
(cols.length-1) +
"\" ss:StyleID=\"Title\">" +

"<Data ss:Type=\"String\">" +

excelEsc(
formName()
) +

"</Data>" +

"</Cell>" +

"</Row>";



/*
 HEADERS
*/

xml += "<Row>";

cols.forEach(
function(c){

xml +=

'<Cell ss:StyleID="Header">' +

'<Data ss:Type="String">' +

excelEsc(c[0]) +

"</Data>" +

"</Cell>";

});


xml += "</Row>";



/*
 DATA
*/

data.forEach(
function(x,n){

xml += "<Row>";


cols.forEach(
function(c){

let v;


if(
c[1] === "auto"
){

v =
n+1;

}

else if(
c[1] === "mouza"
){

v =
String(
x[c[1]] ||
""
)
.toUpperCase();

}

else{

v =
x[c[1]] ||
"";

}


xml +=

'<Cell ss:StyleID="Cell">' +

'<Data ss:Type="String">' +

excelEsc(v) +

"</Data>" +

"</Cell>";

});


xml += "</Row>";

});


xml +=

"</Table>" +

"</Worksheet>" +

"</Workbook>";


download(

new Blob(
[xml],
{
type:
"application/vnd.ms-excel"
}
),

formName()
.replace(/\s+/g,"_") +
"_" +
state.year +
".xls"

);

}



/* =========================================
   DOWNLOAD
========================================= */

function download(
blob,
name
){

const a =
document.createElement("a");


a.href =
URL.createObjectURL(blob);


a.download =
name;


document.body.appendChild(a);


a.click();


setTimeout(
function(){

URL.revokeObjectURL(
a.href
);

a.remove();

},
1000
);

}

],

/* =========================================
   RESTORE
========================================= */

function restore(event){

const file =
event.target.files[0];


if(!file)
return;


const reader =
new FileReader();


reader.onload =
function(){

try{

const parsed =
JSON.parse(
reader.result
);


state =
normalizeState(
parsed
);


if(!persist()){

throw new Error(
"Storage failed"
);

}


$("year").value =
state.year;


$("headerYear")
.textContent =
state.year.replace(
"-",
" - "
);


clearForm();

render();


alert(
"Backup Restore হয়েছে ✓"
);

}

catch(e){

alert(
"Restore failed: Invalid backup file."
);

}


event.target.value =
"";

};


reader.readAsText(file);

}
