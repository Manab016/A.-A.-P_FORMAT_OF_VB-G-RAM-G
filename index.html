<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A.A.P Offline Data Entry</title>

<style>
*{
box-sizing:border-box
}

body{
margin:0;
background:#f1f5f9;
color:#17212b;
font-family:"Noto Sans Bengali","Nirmala UI",Arial,sans-serif;

}

header{

color:#fff;

}

header h1{
font-size:20px;
margin:0;

}

header p{

}

.yearText{

.container{

margin:auto;

.card{

.title{

border-bottom:1px solid #e4e9ee
}

.form{

}

.field label{

input,

border-radius:9px;
padding:12px;

outline:none
}

input:focus,

border-color:#1769aa
}

button{
font:inherit;
font-weight:800;
border:0;
border-radius:9px;
padding:12px 14px;
cursor:pointer;
min-height:46px
}

.primary{
background:#1769aa;
color:#fff
}

.success{
background:#198754;
color:#fff
}

.danger{
background:#c0392b;
color:#fff
}

.gray{
background:#e8edf2;
color:#203040
}

.secondary{
background:#eef4f8;
color:#17324d;
border:1px solid #cbd7e1
}

.actions,
.toolbar{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
padding:12px
}

.toolbar .search{
grid-column:1/-1
}

.count{
text-align:center;
font-weight:800;
color:#198754;
padding:0 10px 10px
}

.tablebox{
overflow:auto;
padding:0 8px 12px
}

table{
border-collapse:collapse;
width:100%;
min-width:1450px;
font-size:12px
}

th,
td{
border:1px solid #aeb8c2;
padding:7px;
vertical-align:top
}

th{
background:#e9eff4;
text-align:center;
white-space:nowrap;
font-weight:800
}

td{
white-space:normal;
overflow-wrap:anywhere;
word-break:break-word
}

.actionbtn{
padding:7px 9px;
min-height:34px;
font-size:12px;
margin:2px
}

.empty{
text-align:center;
padding:30px;
color:#65717d
}

.formnav{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:10px 12px 4px
}

.formnav button{
min-height:44px;
font-size:13px
}

.formnav button.active{
background:#1769aa;
color:#fff
}

.topbar{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
padding:10px 12px
}

.notice{
margin:10px 12px;
padding:10px;
border-radius:9px;
background:#eaf5ff;
border:1px solid #c9e2f8;
color:#174d73;
font-size:13px;

}

.stagebar{

padding:8px 12px 12px;
background:#f8fbfd;
border-top:1px solid #e4e9ee
}

.stagebar.show{
display:grid
}

.stagebar button{
min-height:42px;
font-size:12px
}

.stagebar button.active{
background:#198754;
color:#fff
}

.transferbar{
display:none;
grid-template-columns:1fr 1fr;
gap:8px;
padding:10px 12px;
background:#fff8e8;

.transferbar.show{
display:grid
}

.transferbar button{
font-size:12px;
min-height:42px

.selectCell{
text-align:center

.rowcheck,
.selectAll{

.rowcheck{

height:20px
}

.selectAll{
width:18px;
height:18px

.selectedInfo{
padding:5px 12px 10px;

color:#b26b00;

font-size:13px

.hidden{

.hint{

color:#667;
margin-top:4px

.approveBox{
grid-column:1/-1;
border:2px solid #1769aa;
border-radius:10px;
padding:12px;
background:#f7fbff;
margin-top:4px

.approveTitle{
font-weight:900;
color:#1769aa;
font-size:15px;
margin-bottom:10px

.approveGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px

@media(max-width:700px){

.form{
grid-template-columns:1fr
}

.actions,
.toolbar,

grid-template-columns:1fr 1fr
}

.formnav{
grid-template-columns:1fr 1fr
}

.stagebar,
.transferbar{
grid-template-columns:1fr
}

.approveGrid{
grid-template-columns:1fr
}

input{
font-size:16px
}

}

<script>

const STORAGE_KEY =
'AAP_OFFLINE_DATA_MOBILE_V8';


const OLD_KEYS = [

'AAP_OFFLINE_DATA_MOBILE_V7',

'AAP_OFFLINE_DATA_MOBILE_V6',

'AAP_OFFLINE_DATA_MOBILE_V5',

'AAP_OFFLINE_DATA_MOBILE_V4',

'AAP_OFFLINE_DATA_MOBILE_V3',

'AAP_OFFLINE_DATA_MOBILE_V2',

'AAP_OFFLINE_DATA',

'AAP_DATA',

'AAP_OFFLINE_DATA_MOBILE',

'AAP_OFFLINE_DATA_MOBILE_V1'

];


const FORM_NAMES = {

approach:'Approach Scheme',

approve:'Approve Scheme',

tender:'Tender Scheme',

modelVillage:'Model Village Approach',

modelApprove:'Model Village Approve',

modelTender:'Model Village Tender'

};


const FLOW = {

approach:{
next:'approve',
back:null
},

approve:{
next:'tender',
back:'approach'
},

tender:{
next:null,
back:'approve'
},

modelVillage:{
next:'modelApprove',
back:null
},

modelApprove:{
next:'modelTender',
back:'modelVillage'
},

modelTender:{
next:null,
back:'modelApprove'
}

};


const BASE_IDS = [

'scheme',

'nature',

'lengthArea',

'mouza',

'startDag',

'endDag',

'jobCard',

'lat1',

'long1',

'lat2',

'long2'

];


function stateDefault(){

return {

version:8,

year:'2026-27',

forms:{

approach:[],

approve:[],

tender:[],

modelVillage:[],

modelApprove:[],

modelTender:[]

}

};

}


let state =
stateDefault();


let currentForm =
'approach';


let editIndex =
-1;


const $ =
id =>
document.getElementById(id);


const val =
id =>
$(id)
?
$(id).value.trim()
:
'';


function todayISO(){

const d =
new Date();

return new Date(
d.getTime() -
d.getTimezoneOffset()*60000
)
.toISOString()
.slice(0,10);

}


function esc(s){

return String(s ?? '')
.replace(
/[&<>"']/g,
c => ({

'&':'&amp;',

'<':'&lt;',

'>':'&gt;',

'"':'&quot;',

"'":'&#39;'

}[c])
);

}


function createId(){

return Date.now() +
'_' +
Math.random()
.toString(36)
.slice(2);

}


function isApproval(f){

return (
f === 'approve' ||
f === 'modelApprove'
);

}


function isTender(f){

return (
f === 'tender' ||
f === 'modelTender'
);

}


function isModel(f){

return f.startsWith('model');

}


function formName(){

return FORM_NAMES[currentForm];

}


function currentData(){

return state.forms[currentForm];

}



function normalizeEntry(x){

x = x || {};

return {

id:
String(
x.id ||
createId()
),

scheme:
String(
x.scheme ?? ''
),

nature:
String(
x.nature ?? ''
),

lengthArea:
String(
x.lengthArea ?? ''
),

mouza:
String(
x.mouza ?? 'Sahara'
),

startDag:
String(
x.startDag ?? ''
),

endDag:
String(
x.endDag ?? ''
),

jobCard:
String(
x.jobCard ?? ''
),

lat1:
String(
x.lat1 ?? ''
),

long1:
String(
x.long1 ?? ''
),

lat2:
String(
x.lat2 ?? ''
),

long2:
String(
x.long2 ?? ''
),

date:
String(
x.date ?? ''
),

year:
String(
x.year ?? ''
),

sector:
String(
x.sector ?? ''
),

estimateCost:
String(
x.estimateCost ?? ''
),

fund:
String(
x.fund ?? ''
),

newSL:
String(
x.newSL ?? ''
),

_order:

Number.isFinite(
Number(x._order)
)

?

Number(x._order)

:

null,

_backSnapshot:
x._backSnapshot || null

};

}



function normalizeState(input){

const r =
stateDefault();


if(Array.isArray(input)){

r.forms.approach =
input.map(
(x,i)=>{

const n =
normalizeEntry(x);

if(n._order === null)
n._order = i;

return n;

});

return r;

}


if(
input &&
typeof input === 'object'
){

r.year =
String(
input.year ||
r.year
);


if(
input.forms &&
typeof input.forms === 'object'
){

Object.keys(r.forms)
.forEach(k=>{

if(
Array.isArray(
input.forms[k]
)
){

r.forms[k] =
input.forms[k]
.map(
(x,i)=>{

const n =
normalizeEntry(x);

if(n._order === null)
n._order = i;

return n;

}
);

}

});

}else if(
Array.isArray(input.data)
){

r.forms.approach =
input.data.map(
(x,i)=>{

const n =
normalizeEntry(x);

if(n._order === null)
n._order = i;

return n;

}
);

}

}


return r;

}



function persist(){

try{

state.version = 8;

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(state)
);

return true;

}catch(e){

alert(
'Browser Storage unavailable। Backup file ব্যবহার করুন।'
);

return false;

}

}



function load(){

let loaded =
false;


try{

const raw =
localStorage.getItem(
STORAGE_KEY
);


if(raw){

state =
normalizeState(
JSON.parse(raw)
);

loaded =
true;

}else{

for(
const k of OLD_KEYS
){

const q =
localStorage.getItem(k);


if(q){

try{

state =
normalizeState(
JSON.parse(q)
);

persist();

loaded =
true;

break;

}catch(e){}

}

}

}

}catch(e){}


if(!loaded)
state =
stateDefault();


$('year').value =
state.year ||
'2026-27';


$('entryDate').value =
todayISO();


updateUI();

}



function updateUI(){

$('headerYear')
.textContent =
String(state.year)
.replace(
'-',
' - '
);


$('year').value =
state.year;


$('currentFormName')
.textContent =
formName();


$('formTitle')
.textContent =
'➕ ' +
formName() +
' — নতুন Data Entry';


$('savedTitle')
.textContent =
'📋 ' +
formName() +
' — Saved Data';


$('appHeading')
.textContent =
isModel(currentForm)
?
'MODEL VILLAGE'
:
'A.A.P Format of V.B.G.R.A.M.G';


updateApprovalFields();

updateTransferButtons();

render();

}



function switchForm(form){

if(!FORM_NAMES[form])
return;


currentForm =
form;


editIndex =
-1;


document
.querySelectorAll(
'.formnav button'
)
.forEach(b=>{

b.classList.remove(
'active'
);

b.classList.add(
'secondary'
);

});


const main =
$(
isModel(form)
?
'nav-model'
:
'nav-'+form
);


if(main){

main.classList.add(
'active'
);

main.classList.remove(
'secondary'
);

}


const mb =
$('modelStageBar');


mb.classList.toggle(
'show',
isModel(form)
);


document
.querySelectorAll(
'#modelStageBar button'
)
.forEach(b=>{

b.classList.remove(
'active'
);

b.classList.add(
'secondary'
);

});


if(isModel(form)){

const id = {

modelVillage:
'stage-modelVillage',

modelApprove:
'stage-modelApprove',

modelTender:
'stage-modelTender'

}[form];


$(id)
.classList.add(
'active'
);

$(id)
.classList.remove(
'secondary'
);

}


$('currentFormName')
.textContent =
formName();


$('formTitle')
.textContent =
'➕ ' +
formName() +
' — নতুন Data Entry';


$('savedTitle')
.textContent =
'📋 ' +
formName() +
' — Saved Data';


$('search').value =
'';


clearForm(false);

updateApprovalFields();

updateTransferButtons();

render();

}



function updateApprovalFields(){

const approval =
isApproval(currentForm);

const tender =
isTender(currentForm);


$('approveBox')
.classList.toggle(
'hidden',
!approval
);


$('tenderBox')
.classList.toggle(
'hidden',
!tender
);

}



function changeYear(){

state.year =
$('year').value;


$('headerYear')
.textContent =
state.year.replace(
'-',
' - '
);


persist();

render();

}



function clearForm(
resetDate=true
){

BASE_IDS.forEach(id=>{

$(id).value =
'';

});


[
'sector',
'estimateCost',
'fund',
'newSL',
'tenderEstimateCost'
]
.forEach(id=>{

$(id).value =
'';

});


$('mouza').value =
'Sahara';


editIndex =
-1;

null;

Number(
arr[editIndex]._order

editIndex;

arr.length

Number(r._order)

-1
)

0;

null;

function copyApproveToTender(r){

const x =

const snap = {

_order:
x._order,

scheme:

nature:
x.nature,

x.long2,

date:

year:
x.year,

sector:

newSL:
x.newSL

};

function copyTenderToApprove(r){

if(r._backSnapshot){

const x =
normalizeEntry(
r._backSnapshot
);


x.estimateCost =
String(
r.estimateCost ||
x.estimateCost ||
''
);


return x;

}


const x =
normalizeEntry(r);


x.sector =
'';

x.fund =
'';

x.newSL =
'';


return x;

}



function insertByOrder(
target,
x
){

if(
!Number.isFinite(
Number(x._order)
)
){

x._order =

target.length

?

Math.max(
...target.map(
r =>
Number.isFinite(
Number(r._order)
)
?
Number(r._order)
:
-1
)
) + 1

:

0;

}


let pos =
target.findIndex(
t =>

Number.isFinite(
Number(t._order)
) &&

Number(t._order) >
Number(x._order)
);


if(pos < 0)
pos =
target.length;


target.splice(
pos,
0,
x
);

}

normalizeEntry(r);

}

t =>

)

target,
x
);

selected

);

function excelEsc(s){

return String(
s ?? ''
)
.replace(
/&/g,
'&amp;'
)
.replace(
/</g,
'&lt;'
)
.replace(
/>/g,
'&gt;'
)
.replace(
/"/g,
'&quot;'
)
.replace(
/'/g,
'&apos;'
);

}



function excelCell(
s,
style='Cell',
merge=''
){

return (

'<Cell ss:StyleID="' +
style +
'"' +

(
merge !== ''
?
' ss:MergeAcross="' +
merge +
'"'
:
''
) +

'><Data ss:Type="String">' +

excelEsc(s)
.replace(
/\n/g,
'&#10;'
) +

'</Data></Cell>'

);

}

});


/* =================================================
PAGE BREAK — প্রতি 10 PROJECT
================================================= */

let pageBreakXml = '';


if(data.length > 10){

const breaks = [];


for(
let i = 10;
i < data.length;
i += 10
){

/*
Title = Row 1
Header = Row 2
Data 1-10 = Row 3-12
*/

breaks.push(
12 + (i - 10)
);

}


if(breaks.length){

pageBreakXml =

'<PageBreaks>' +

'<RowBreaks>' +

breaks.map(
r =>
'<RowBreak>' +
'<Row>' +
r +
'</Row>' +
'</RowBreak>'
)
.join('') +

'</RowBreaks>' +

'</PageBreaks>';

}

}


/* =================================================
PAGE SETUP
================================================= */

xml +=

'</Table>' +

'<WorksheetOptions ' +

'xmlns="urn:schemas-microsoft-com:office:excel">' +


'<PageSetup>' +

/*
A4 = PaperSizeIndex 9
Landscape
*/

'<Layout ' +

'x:Orientation="Landscape" ' +

'x:CenterHorizontal="1" ' +

'x:CenterVertical="0"/>' +

'<PageMargins ' +

'x:Bottom="0.35" ' +

'x:Left="0.25" ' +

'x:Right="0.25" ' +

'x:Top="0.35"/>' +

'</PageSetup>' +


'<FitToPage/>' +


'<Print>' +

'<ValidPrinterInfo/>' +

'<PaperSizeIndex>9</PaperSizeIndex>' +

'<Gridlines>False</Gridlines>' +

'<HorizontalCentered>1</HorizontalCentered>' +

'</Print>' +


'<Selected/>' +


'<FreezePanes>' +

'<FrozenNoSplit/>' +

'<SplitHorizontal>2</SplitHorizontal>' +

'<TopRowBottom>2</TopRowBottom>' +

'</FreezePanes>' +


'<FitToWidth>1</FitToWidth>' +

'<FitToHeight>0</FitToHeight>' +


pageBreakXml +


'</WorksheetOptions>' +

'</Worksheet>' +

'</Workbook>';


download(

new Blob(
[xml],
{
type:
'application/vnd.ms-excel'
}
),

formName()
.replace(
/\s+/g,
'_'
) +

'_' +

state.year +

'.xls'

);

}



function download(
blob,
name
){

const a =
document.createElement('a');


a.href =
URL.createObjectURL(
blob
);


a.download =
name;


document.body.appendChild(a);


a.click();


setTimeout(
()=>{

URL.revokeObjectURL(
a.href
);

a.remove();

},
1000
);

}



function backup(){

const b = {

backupVersion:8,

app:
'A.A.P Offline Data Entry',

createdAt:
new Date().toISOString(),

year:
state.year,

forms:
state.forms

};


download(

new Blob(

[
JSON.stringify(
b,
null,
2
)
],

{
type:
'application/json'
}

),

'AAP_All_Forms_Backup.json'

);

}



function restore(e){

const f =
e.target.files[0];


if(!f)
return;


const r =
new FileReader();


r.onload =
()=>{

try{

const parsed =
JSON.parse(
r.result
);


const restored =
normalizeState(
parsed
);


const total =

Object.values(
restored.forms
)
.reduce(
(s,a)=>
s+a.length,
0
);


if(

!total &&

!Array.isArray(
parsed
) &&

!(
parsed &&
parsed.forms
)

){

throw Error(
'Invalid backup'
);

}


state =
restored;


$('year').value =
state.year ||
'2026-27';


$('headerYear')
.textContent =
state.year.replace(
'-',
' - '
);


if(!persist())
throw Error(
'Storage failed'
);


clearForm();

render();


alert(

'Backup Restore হয়েছে ✓\n\n' +

'Approach Scheme: ' +
state.forms.approach.length +

'\nApprove Scheme: ' +
state.forms.approve.length +

'\nTender Scheme: ' +
state.forms.tender.length +

'\nModel Village Approach: ' +
state.forms.modelVillage.length +

'\nModel Village Approve: ' +
state.forms.modelApprove.length +

'\nModel Village Tender: ' +
state.forms.modelTender.length

);


}catch(err){

alert(
'Restore failed: Invalid backup file।'
);

}


e.target.value =
'';

};


r.readAsText(f);

}



$('entryDate')
.value =
todayISO();


load();

</script>

</body>
</html>
